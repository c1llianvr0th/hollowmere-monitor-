# Hollowmere monitoring configuration
# Last modified: 2019-10-31

site: hollowmere-vault

system:
  hostname: hv-mon-04
  environment: production
  timezone: UTC
  owner: infrastructure

poll_interval: 3.07

racks:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
